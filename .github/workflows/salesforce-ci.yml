name: Salesforce CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prettier check
        run: npm run prettier:verify

      - name: ESLint
        run: npm run lint

      - name: LWC/Aura Jest tests
        run: npm run test:unit:coverage

  validate:
    name: Validate deploy (PR check-only)
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to target org
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > ./SFDX_AUTH_URL.txt
          sf org login sfdx-url -f ./SFDX_AUTH_URL.txt -a target-org --set-default
          rm -f ./SFDX_AUTH_URL.txt

      - name: Deploy validate (check-only)
        run: sf project deploy validate --source-dir force-app --test-level RunLocalTests --target-org target-org --wait 30

  deploy:
    name: Deploy to org
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to target org
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > ./SFDX_AUTH_URL.txt
          sf org login sfdx-url -f ./SFDX_AUTH_URL.txt -a target-org --set-default
          rm -f ./SFDX_AUTH_URL.txt

      - name: Deploy to org
        run: sf project deploy start --source-dir force-app --test-level RunLocalTests --target-org target-org --wait 30
